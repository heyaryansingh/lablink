<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab Link Web</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <header class="topbar">
        <div>
          <div class="product-mark">Lab Link</div>
          <div class="muted small">Loading workspace...</div>
        </div>
        <div class="topbar-actions">
          <button class="button ghost" type="button" disabled>Sync</button>
          <button class="button primary" type="button" disabled>Meeting Studio</button>
        </div>
      </header>
      <main class="boot-panel">
        <div class="panel">
          <div class="eyebrow">Web runtime</div>
          <h1>Preparing Lab Link</h1>
          <p>Loading the local workspace and integration status.</p>
        </div>
      </main>
    </div>
  </body>
</html>
